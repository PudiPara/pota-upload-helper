name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "README.md", "CLAUDE.md"]
  workflow_dispatch:
    inputs:
      data_release:
        description: "Data-only release: the last released app (tag v<VERSION>) with this commit's pota.app data"
        type: boolean
        default: false

permissions:
  contents: write

# One build at a time, in push order: two at once let the older version finish last and take
# "Latest" (2.0.41 over 2.0.42), and the updater only reads releases/latest (a prerelease: only apps with 試験版 on). Only one run waits;
# a third push skips the middle version, never the newest.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # Apple Silicon
            asset: Potaroo-macOS.zip
          - os: windows-latest
            asset: Potaroo-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Data release - the released code with this commit's data
        if: inputs.data_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the last public release's code (releases/latest skips prereleases: a version still being tried stays out)
          VER="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name | sed 's/^v//; s/-data-.*//')"
          git fetch --depth=1 origin "refs/tags/v$VER:refs/tags/v$VER"
          git checkout "v$VER"
          git checkout "$GITHUB_SHA" -- assets/parks.tsv.gz assets/pota-data.txt locations.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller pywebview
      - run: python -m unittest discover -s tests -v

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "Potaroo" \
            --osx-bundle-identifier com.jl1fva.pota-upload-helper \
            --icon assets/icon.icns \
            --add-data "ui:ui" --add-data "assets/parks.tsv.gz:assets" --add-data "assets/pota-data.txt:assets" app.py
          # macOS 15+ asks for "Local Network" permission before an app may receive
          # multicast (WSJT-X on 224.0.0.1); the prompt needs this usage string.
          APP="dist/Potaroo.app"
          VER="$(python3 -c 'import potacommon; print(potacommon.VERSION)')"
          plutil -replace CFBundleShortVersionString -string "$VER" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VER" "$APP/Contents/Info.plist"
          plutil -replace NSLocalNetworkUsageDescription -string "ロガー（WSJT-X や RUMlogNG）から UDP で QSO を受け取るために使います。" "$APP/Contents/Info.plist"
          plutil -replace NSHumanReadableCopyright -string "JL1FVA" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"   # re-seal after editing Info.plist
          # zip: what the in-app updater downloads.  dmg: what people install from.
          (cd dist && ditto -c -k --keepParent "Potaroo.app" "../Potaroo-macOS.zip")
          cp Potaroo-macOS.zip POTA-Upload-Helper-macOS.zip   # what 1.x's updater looks for
          rm -rf dmg && mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Potaroo" -srcfolder dmg -ov -format UDZO Potaroo-macOS.dmg

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Potaroo" --icon assets/icon.ico --add-data "ui;ui" --add-data "assets/parks.tsv.gz;assets" --add-data "assets/pota-data.txt;assets" app.py
          # zip: what the in-app updater downloads.  Setup.exe: what people install from (Inno Setup, per-user).
          Compress-Archive -Path "dist/Potaroo.exe" -DestinationPath "Potaroo-Windows.zip"
          Copy-Item "Potaroo-Windows.zip" "POTA-Upload-Helper-Windows.zip"   # what 1.x's updater looks for
          $ver = python -c "import potacommon; print(potacommon.VERSION)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=$ver" installer\windows.iss
          if (-not (Test-Path "Potaroo-Setup.exe")) { throw "installer was not built" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            Potaroo-*.zip
            Potaroo-*.dmg
            POTA-Upload-Helper-*.zip
            Potaroo-Setup.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(python3 -c 'import potacommon; print(potacommon.VERSION)')"
          if [ "${{ inputs.data_release }}" = "true" ]; then
            VER="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name | sed 's/-data-.*//')"   # as the build job
            echo "pre=false" >> "$GITHUB_OUTPUT"      # the public version with new data: for everyone
            DV="$(cat assets/pota-data.txt)"      # the updater reads "-data-" (updater.parse_tag)
            echo "v=$VER-data-$DV" >> "$GITHUB_OUTPUT"
            echo "name=Potaroo $VER (park data $DV)" >> "$GITHUB_OUTPUT"
            echo "body=pota.app park list $DV - same app as $VER." >> "$GITHUB_OUTPUT"
            echo "notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "v=$VER" >> "$GITHUB_OUTPUT"
            echo "name=Potaroo $VER" >> "$GITHUB_OUTPUT"
            echo "notes=true" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"       # tried on the air first; made public by hand (CLAUDE.md)
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: ${{ steps.ver.outputs.name }}
          body: ${{ steps.ver.outputs.body }}
          target_commitish: ${{ github.sha }}
          files: |
            Potaroo-macOS.dmg
            Potaroo-Setup.exe
            Potaroo-macOS.zip
            Potaroo-Windows.zip
            POTA-Upload-Helper-macOS.zip
            POTA-Upload-Helper-Windows.zip
          generate_release_notes: ${{ steps.ver.outputs.notes == 'true' }}
          prerelease: ${{ steps.ver.outputs.pre == 'true' }}
          make_latest: ${{ steps.ver.outputs.pre == 'true' && 'false' || 'true' }}
