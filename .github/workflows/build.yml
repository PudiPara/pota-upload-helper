name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "README.md", "CLAUDE.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # Apple Silicon
            asset: POTA-Upload-Helper-macOS.zip
          - os: windows-latest
            asset: POTA-Upload-Helper-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller pywebview
      - run: python -m unittest discover -s tests -v

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "POTA Upload Helper" \
            --osx-bundle-identifier com.jl1fva.pota-upload-helper \
            --icon assets/icon.icns \
            --add-data "ui:ui" app.py
          # macOS 15+ asks for "Local Network" permission before an app may receive
          # multicast (WSJT-X on 224.0.0.1); the prompt needs this usage string.
          APP="dist/POTA Upload Helper.app"
          VER="$(python3 -c 'import potacommon; print(potacommon.VERSION)')"
          plutil -replace CFBundleShortVersionString -string "$VER" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VER" "$APP/Contents/Info.plist"
          plutil -replace NSLocalNetworkUsageDescription -string "ロガー（WSJT-X や RUMlogNG）から UDP で QSO を受け取るために使います。" "$APP/Contents/Info.plist"
          plutil -replace NSHumanReadableCopyright -string "JL1FVA" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"   # re-seal after editing Info.plist
          # zip: what the in-app updater downloads.  dmg: what people install from.
          (cd dist && ditto -c -k --keepParent "POTA Upload Helper.app" "../POTA-Upload-Helper-macOS.zip")
          rm -rf dmg && mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "POTA Upload Helper" -srcfolder dmg -ov -format UDZO POTA-Upload-Helper-macOS.dmg

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "POTA Upload Helper" --icon assets/icon.ico --add-data "ui;ui" app.py
          # zip: what the in-app updater downloads.  Setup.exe: what people install from (Inno Setup, per-user).
          Compress-Archive -Path "dist/POTA Upload Helper.exe" -DestinationPath "POTA-Upload-Helper-Windows.zip"
          $ver = python -c "import potacommon; print(potacommon.VERSION)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=$ver" installer\windows.iss
          if (-not (Test-Path "POTA-Upload-Helper-Setup.exe")) { throw "installer was not built" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            POTA-Upload-Helper-*.zip
            POTA-Upload-Helper-*.dmg
            POTA-Upload-Helper-Setup.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "v=v$(python3 -c 'import potacommon; print(potacommon.VERSION)')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: POTA Upload Helper ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: |
            POTA-Upload-Helper-macOS.dmg
            POTA-Upload-Helper-Setup.exe
            POTA-Upload-Helper-macOS.zip
            POTA-Upload-Helper-Windows.zip
          generate_release_notes: true
