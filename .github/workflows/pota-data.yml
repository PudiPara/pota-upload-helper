name: Update POTA data

# Once a month: refresh the park list and location names shipped with the app
# (scripts/update_pota_data.py) and commit them to main when they changed. No release is made here -
# the new data goes out with the next release. A push by GITHUB_TOKEN does not start the build workflow.
on:
  schedule:
    - cron: "0 18 1 * *"        # the 1st of every month, 18:00 UTC (03:00 JST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_pota_data.py
      - run: python -m unittest discover -s tests
      - name: Commit when the data changed
        run: |
          if git diff --quiet -- assets/parks.tsv.gz locations.py; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/parks.tsv.gz locations.py
          git commit -m "Monthly pota.app data: park list and location names"
          git push
